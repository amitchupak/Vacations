# Course server: public IP 34.244.57.210 | terminal :5000 | VS Code :5001
# See AWS-SETUP.md for how to start the app and open it in a browser.
services:
  mongo:
    image: mongo:latest
    container_name: vacations_mongodb
    environment:
      MONGO_INITDB_DATABASE: vacations
    ports:
      - "27018:27017"
    volumes:
      # Persist MongoDB data automatically on the host (no manual sync script needed).
      - ./Database/mongo-data:/data/db
  
  mongo-sync:
    image: mongo:latest
    container_name: vacations_mongo_sync
    depends_on:
      - mongo
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        HOST_URI='mongodb://host.docker.internal:27017/vacations'
        DOCKER_URI='mongodb://mongo:27017/vacations'
        ARCHIVE='/tmp/vacations.archive'

        echo '[mongo-sync] Waiting for Docker MongoDB...'
        READY=0
        for i in $$(seq 1 30); do
          if mongosh "$$DOCKER_URI" --quiet --eval "db.runCommand({ ping: 1 }).ok" >/dev/null 2>&1; then
            READY=1
            break
          fi
          sleep 1
        done

        if [ "$$READY" != "1" ]; then
          echo '[mongo-sync] Docker MongoDB not reachable yet. Skipping seed sync.'
          exit 0
        fi

        echo '[mongo-sync] Checking Docker vacations database state...'
        DOCKER_COLLECTIONS="$$(mongosh "$$DOCKER_URI" --quiet --eval "db.getCollectionNames().length" 2>/dev/null | tr -dc '0-9')"
        if [ -n "$$DOCKER_COLLECTIONS" ] && [ "$$DOCKER_COLLECTIONS" != "0" ]; then
          echo '[mongo-sync] Docker vacations database already has data. Skipping seed sync.'
          exit 0
        fi

        echo '[mongo-sync] Checking host MongoDB availability...'
        if ! mongosh "$$HOST_URI" --quiet --eval "db.runCommand({ ping: 1 }).ok" >/dev/null 2>&1; then
          echo '[mongo-sync] Host MongoDB not reachable at host.docker.internal:27017. Skipping sync.'
          exit 0
        fi

        HOST_COLLECTIONS="$$(mongosh "$$HOST_URI" --quiet --eval "db.getCollectionNames().length" 2>/dev/null | tr -dc '0-9')"
        if [ -z "$$HOST_COLLECTIONS" ] || [ "$$HOST_COLLECTIONS" = "0" ]; then
          echo '[mongo-sync] Host vacations database is empty. Skipping sync.'
          exit 0
        fi

        echo '[mongo-sync] Exporting host vacations database...'
        mongodump --uri="$$HOST_URI" --archive="$$ARCHIVE" --gzip >/dev/null
        echo '[mongo-sync] Restoring into Docker vacations database...'
        mongorestore --uri="$$DOCKER_URI" --drop --archive="$$ARCHIVE" --gzip >/dev/null
        echo '[mongo-sync] Sync completed successfully.'
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: ./Backend/Dockerfile
    container_name: vacations_backend
    env_file:
      - ./Backend/.env
    environment:
      MONGODB_CONNECTION_STRING: mongodb://mongo:27017/vacations
      PORT: "4001"
      ENVIRONMENT: development
      NODE_ENV: development
      # Loaded from the root .env file (gitignored). Override here is needed because
      # Backend/.env has quoted values that some compose versions parse with a leading space.
      JWT_SECRET: ${JWT_SECRET:-}
      HASH_SALT: ${HASH_SALT:-}
    ports:
      - "4001:4001"
    depends_on:
      mongo:
        condition: service_started
      mongo-sync:
        condition: service_completed_successfully
    volumes:
      - ./Backend:/app
      - /app/node_modules
      - backend_assets:/app/src/1-assets
    command: npm start

  frontend:
    build:
      context: .
      dockerfile: ./Frontend/Dockerfile
    container_name: vacations_frontend
    ports:
      - "4002:4000"
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      - /app/node_modules
      - /app/dist
    # VITE_DEV_PORT=4000 inside the container (host :4002 maps to container :4000).
    # Empty = use browser location (Cloudflare tunnel + local nginx on :5002). For AWS option B, set in root .env.
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_DEV_PORT: "4000"

  # Public entry. AWS often blocks 80/8080/40xx/5002. Use cloudflared (below) for a real public URL.
  proxy:
    image: nginx:alpine
    container_name: vacations_proxy
    ports:
      - "80:80"
      - "8080:80"
      - "5002:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Outbound-only tunnel — works even when inbound HTTP is blocked. After `docker compose up -d`, run:
  #   docker compose logs cloudflared
  # and open the printed https://....trycloudflare.com URL. No extra AWS port rules needed.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vacations_cloudflared
    command: tunnel --no-autoupdate --url http://proxy:80
    depends_on:
      - proxy
    restart: on-failure

volumes:
  backend_assets:
